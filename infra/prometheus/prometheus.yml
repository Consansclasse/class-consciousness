# Configuration Prometheus — scrape les métriques du pipeline RAG.
# L'API expose /metrics (cf. apps/api/src/cc_api/core/metrics.py).
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: cc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
